openapi: 3.0.3
info:
  title: Technology Catalog and Buying Assistant API
  version: 1.0.0
  description: |
    HTTP API for product search, catalog metadata, and technology buying advice.
    Responses use a `success`/`data` envelope. Prices are decimal **strings** in
    EGP, so clients should use decimal arithmetic rather than floating-point arithmetic.

    ## Getting started
    Start the backend with its required `DATABASE_URL`, `TYPESENSE_URL`,
    `TYPESENSE_API_KEY`, `AI_BASE_URL`, and `AI_MODEL` configuration. `AI_BASE_URL`
    is an OpenAI-compatible base ending in `/v1`; `AI_MODEL` is the opaque model
    identifier advertised by that server. `AI_API_KEY` may be empty for a local
    server. `AI_TIMEOUT` defaults to `180s`. It listens on port 8082 by default; `PORT`
    can change that. Substitute your deployment's base URL for the local URL
    below. Check `/health`, fetch `/products/categories`, `/products/providers`,
    and `/products/brands` to obtain IDs, then use those IDs to filter `/products`.
    Use a returned product `id` with `/products/{id}` for its canonical source
    URL and timestamps.

    Product lists, search, and details are served from Typesense. PostgreSQL is
    authoritative and supplies the category, provider, and brand lookups. Populate
    a new Typesense collection with `just reindex-products` or `go run ./cmd/reindex`.
    Reindexing upserts PostgreSQL products in keyset batches, then removes stale
    Typesense documents after every import succeeds. It can be rerun.

    The scheduled catalog refresh is `scripts/refresh_catalog.sh`. It runs the
    sibling `pc-parts` crawler, then reindexes even if one provider fails after
    other providers have committed. Install `deploy/catalog-refresh.cron` in the
    host crontab for 00:00 and 12:00 Africa/Cairo. The cron daemon itself must
    use that timezone; replace any crawler-only entry so crawls do not run twice.

    Chat sessions use Google ADK SessionService. `AI_SESSION_STORAGE=memory` is
    the default and loses sessions on restart. Set `AI_SESSION_STORAGE=postgres`
    to use ADK's official database SessionService on `DATABASE_URL`; ADK creates
    its own session tables at startup. Until authentication is added, the opaque
    `session_id` is a bearer token and should be kept private.

    ```sh
    curl 'http://localhost:8082/health'
    curl 'http://localhost:8082/products/categories'
    curl 'http://localhost:8082/products?category_ids=1&provider_ids=2&in_stock=true&page=1&limit=20'
    curl 'http://localhost:8082/products/search?q=rtx%205070&page=1&limit=20'
    curl 'http://localhost:8082/products/42'
    curl -X POST 'http://localhost:8082/ai/chat' -H 'Content-Type: application/json' -d '{"message":"Find me an RX 9070"}'
    ```

    ## Filtering and pagination
    Repeat an ID parameter or separate IDs with commas, for example
    `category_ids=1&category_ids=2` or `category_ids=1,2`. IDs within a group are ORed; category,
    provider, brand, price, and stock groups are ANDed. Empty or omitted ID groups
    do not filter. Price bounds are inclusive; products with unknown (`null`)
    price do not match a price bound. `in_stock=true` and `in_stock=false` both
    exclude products whose stock is unknown (`null`). Omitting `in_stock` includes
    all three stock states.

    Pages are numbered from 1. The defaults are `page=1` and `limit=10`, with a
    maximum limit of 100. `page_size` is an alias for `limit` and takes precedence
    when both are supplied. The `meta.total_items` count is for the filtered result,
    and `meta.total_pages` is the ceiling of `total_items / limit`. A page past the
    end returns `items: []` with the same metadata. Without `q`, products default
    to ascending product ID. With `q`, products default to search relevance.
    `sort=id` explicitly orders by ascending ID. Price sorting places unknown prices last in
    both directions and uses ascending ID to break equal-price ties. Because the
    catalog can change between requests, offset-based pagination does not provide
    a frozen snapshot.

    ## Errors and browser access
    Invalid query or path values return HTTP 400 with `BAD_REQUEST`; a missing
    product returns HTTP 404 with `NOT_FOUND`; Typesense outages return HTTP 503
    with `SERVICE_UNAVAILABLE`; unexpected service errors return HTTP 500 with
    `INTERNAL_ERROR`. Error messages and optional `details` appear
    in the standard error envelope. A recovered panic can return a bare 500.
    Browser CORS origins are configured through `CORS_ALLOWED_ORIGINS` (default
    `*`) and `CORS_ALLOW_CREDENTIALS` (default `false`). Allowed preflight requests
    receive HTTP 204; a disallowed preflight receives HTTP 403. CORS is a browser
    policy and does not add API authentication.

    Metadata endpoints normally return `data` as an array. If a metadata table
    has no rows, the shared response encoder omits the empty `data` field, so
    clients should treat an absent `data` there as an empty array.
servers:
  - url: http://localhost:8082
    description: Local server using the default PORT value
tags:
  - name: Health
    description: Service liveness
  - name: Products
    description: Product search and details
  - name: Catalog metadata
    description: IDs and names used by product filters
  - name: AI
    description: Technology buying assistant
security: []
paths:
  /ai/chat:
    post:
      tags: [AI]
      operationId: chatWithBuyingAssistant
      summary: Chat with the technology buying assistant
      description: |
        Omit `session_id` to create an ADK session; send it on later turns to
        resume. The classifier can return a short domain response or clarification.
        Catalog recommendations come from product tools backed by Typesense. The
        structured `products` array contains only listings returned by a catalog
        tool during this request; it includes exact provider purchase URLs.
        For a build, `estimated_total` appears only when current in-stock
        listings cover every essential component. The amount is calculated in
        Go from catalog prices; hardware compatibility still needs checking.
        Search results are bounded to 10 listings per tool call. Local model
        servers may ignore final JSON-format constraints, so the service also
        supports plain-text model replies while grounding structured products.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatRequest'}
      responses:
        '200':
          description: Assistant reply and grounded product recommendations.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404':
          description: The supplied ADK session no longer exists.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Model, session storage, or catalog unavailable.
      x-codeSamples:
        - lang: cURL
          source: "curl -X POST 'http://localhost:8082/ai/chat' -H 'Content-Type: application/json' -d '{\"message\":\"Find me an RX 9070\"}'"

  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check service health
      description: |
        Returns a liveness response from the HTTP process. This handler does not
        query PostgreSQL or Typesense, so a successful response does not prove
        either dependency is currently healthy.
      responses:
        '200':
          description: HTTP service is responding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                success: true
                data:
                  status: ok
      x-codeSamples:
        - lang: cURL
          source: "curl 'http://localhost:8082/health'"

  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List, search, and filter products
      description: |
        Returns a page of products and exact pagination metadata. All filters are
        optional. Use `q` to search name, category slug, brand name, and provider
        name in that priority order. Use the metadata endpoints to discover valid IDs. Repeating an
        ID parameter selects any of those IDs within its group. For example,
        `category_ids=1&category_ids=2&provider_ids=3` selects category 1 **or** 2
        from provider 3. A non-existent but positive ID simply matches no rows.

        Send price bounds as plain non-negative decimal text such as `1000` or
        `1000.50`; do not prefix them with `EGP` or use thousands separators.
        The database stores product prices in EGP. The response encodes each
        non-null price as a string with two decimal places.

        `page` and `limit` values of 0 are treated as omitted by the current
        binding/defaulting behavior; use positive values in new clients. An
        excessive page returns HTTP 400.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/CategoryIDs'
        - $ref: '#/components/parameters/ProviderIDs'
        - $ref: '#/components/parameters/BrandIDs'
        - $ref: '#/components/parameters/MinPrice'
        - $ref: '#/components/parameters/MaxPrice'
        - $ref: '#/components/parameters/InStock'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Product page. An empty result has an empty items array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
              examples:
                matchingProducts:
                  summary: One result on the first page
                  value:
                    success: true
                    data:
                      items:
                        - id: 42
                          name: Example 32 GB DDR5 memory kit
                          price: '3499.00'
                          currency: EGP
                          in_stock: true
                          image_url: https://example.com/images/memory.jpg
                          category: {id: 4, slug: ram}
                          provider: {id: 2, name: elnekhely}
                          brand: {id: 7, name: Example Brand}
                      meta: {page: 1, limit: 10, total_items: 1, total_pages: 1}
                noMatches:
                  summary: No products match the filters
                  value:
                    success: true
                    data:
                      items: []
                      meta: {page: 1, limit: 10, total_items: 0, total_pages: 0}
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: cURL
          label: Combine filters, repeat IDs, and sort by price
          source: >-
            curl -G 'http://localhost:8082/products'
            --data-urlencode 'category_ids=1'
            --data-urlencode 'category_ids=2'
            --data-urlencode 'provider_ids=3'
            --data-urlencode 'min_price=1000.50'
            --data-urlencode 'max_price=5000'
            --data-urlencode 'in_stock=true'
            --data-urlencode 'sort=price_asc'
            --data-urlencode 'page=2'
            --data-urlencode 'limit=25'
        - lang: JavaScript
          label: Fetch a page in a browser or Node.js
          source: |
            const params = new URLSearchParams({page: '1', limit: '20', sort: 'price_asc'});
            params.append('category_ids', '1');
            params.append('category_ids', '2');
            params.set('in_stock', 'true');
            const response = await fetch(`http://localhost:8082/products?${params}`);
            const body = await response.json();
            if (!response.ok) throw new Error(body.error?.message ?? `HTTP ${response.status}`);
            console.log(body.data.items, body.data.meta);
        - lang: Python
          label: Fetch all pages of one filtered result
          source: |
            import requests
            page = 1
            while True:
                response = requests.get('http://localhost:8082/products', params={
                    'category_ids': [1, 2], 'in_stock': 'true',
                    'page': page, 'limit': 100,
                }, timeout=30)
                response.raise_for_status()
                result = response.json()['data']
                for product in result['items']:
                    print(product['id'], product['name'], product['price'])
                if page >= result['meta']['total_pages']:
                    break
                page += 1

  /products/categories:
    get:
      tags: [Catalog metadata]
      operationId: listCategories
      summary: List product categories
      description: |
        Returns all category IDs and slugs, sorted by slug. Pass one or more
        returned IDs as repeated `category_ids` parameters to `/products`. The
        current canonical slugs are `cpu`, `gpu`, `motherboard`, `ram`, `ssd`,
        `hdd`, `case`, `power_supply`, and `cooling`; use this endpoint rather than
        hard-coding IDs because IDs depend on database contents.
      responses:
        '200':
          description: Category array. If empty, the data field is omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
              example:
                success: true
                data:
                  - {id: 1, slug: cpu}
                  - {id: 2, slug: gpu}
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: cURL
          source: "curl 'http://localhost:8082/products/categories'"

  /products/providers:
    get:
      tags: [Catalog metadata]
      operationId: listProviders
      summary: List product providers
      description: |
        Returns provider IDs and names, sorted by name. Pass returned IDs as
        repeated `provider_ids` parameters to `/products`. The current provider
        names are `sigma`, `elnekhely`, and `elbadr`; obtain IDs from this
        endpoint because they depend on database contents.
      responses:
        '200':
          description: Provider array. If empty, the data field is omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidersResponse'
              example:
                success: true
                data:
                  - {id: 1, name: elbadr}
                  - {id: 2, name: elnekhely}
                  - {id: 3, name: sigma}
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: cURL
          source: "curl 'http://localhost:8082/products/providers'"

  /products/brands:
    get:
      tags: [Catalog metadata]
      operationId: listBrands
      summary: List product brands
      description: |
        Returns brand IDs and names, sorted by name. Pass returned IDs as
        repeated `brand_ids` parameters to `/products`. Products with an unknown
        brand have `brand: null` and will not match a brand ID filter.
      responses:
        '200':
          description: Brand array. If empty, the data field is omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandsResponse'
              example:
                success: true
                data:
                  - {id: 8, name: Another Brand}
                  - {id: 7, name: Example Brand}
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: cURL
          source: "curl 'http://localhost:8082/products/brands'"

  /products/search:
    get:
      tags: [Products]
      operationId: searchProducts
      summary: Paginated fuzzy product search for a search bar
      description: |
        Returns one page of Product objects in `data`, with the full matching
        count and page count in `meta`. Request successive pages to see all
        results. `q` is required. Typesense searches name, category slug,
        brand name, and provider name with that priority. The last word can
        match a prefix; ordinary words allow typos, but numeric and mixed
        letter-number model tokens do not. Every query token must match, so
        a missing model number cannot be dropped to broaden the result set.
        Results use relevance order, with product ID as a stable tie breaker.
      parameters:
        - name: q
          in: query
          required: true
          description: Nonempty search text.
          schema: {type: string, minLength: 1}
          example: rtx 5070
        - name: limit
          in: query
          description: Products per page; defaults to 10 and cannot exceed 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 10}
        - name: page
          in: query
          description: One-based result page; defaults to 1.
          schema: {type: integer, minimum: 1, default: 1}
      responses:
        '200':
          description: One page of products, or an empty array when none match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: cURL
          source: "curl 'http://localhost:8082/products/search?q=rtx%205070'"

  /products/{id}:
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get one product by its database ID
      description: |
        Returns the same product fields as `/products`, plus the canonical URL
        of the provider's product page and creation/update timestamps. Use an
        `id` returned from `/products`; the source URL is not this API's ID.
        Products removed by a later successful provider synchronization can
        disappear, in which case this endpoint returns 404.
      parameters:
        - name: id
          in: path
          required: true
          description: Positive 64-bit product ID returned by `/products`.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 42
      responses:
        '200':
          description: Product detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
              example:
                success: true
                data:
                  id: 42
                  name: Example 32 GB DDR5 memory kit
                  price: '3499.00'
                  currency: EGP
                  in_stock: true
                  image_url: https://example.com/images/memory.jpg
                  category: {id: 4, slug: ram}
                  provider: {id: 2, name: elnekhely}
                  brand: {id: 7, name: Example Brand}
                  canonical_product_url: https://example.com/products/example-memory
                  created_at: '2026-09-24T10:00:00Z'
                  updated_at: '2026-09-24T12:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: cURL
          source: "curl 'http://localhost:8082/products/42'"
        - lang: JavaScript
          source: |
            const response = await fetch('http://localhost:8082/products/42');
            const body = await response.json();
            if (!response.ok) throw new Error(body.error?.message ?? `HTTP ${response.status}`);
            console.log(body.data.canonical_product_url);

components:
  parameters:
    Page:
      name: page
      in: query
      description: One-based page number. Omit for page 1.
      schema: {type: integer, minimum: 1, default: 1}
      example: 2
    Limit:
      name: limit
      in: query
      description: Number of results per page; maximum 100. Omit for 10.
      schema: {type: integer, minimum: 1, maximum: 100, default: 10}
      example: 25
    PageSize:
      name: page_size
      in: query
      description: Alias for `limit`; takes precedence if both are supplied.
      schema: {type: integer, minimum: 1, maximum: 100}
      example: 20
    SearchQuery:
      name: q
      in: query
      description: Search product name, category slug, brand name, and provider name; omit for the full listing.
      schema: {type: string}
      example: rtx 5070
    CategoryIDs:
      name: category_ids
      in: query
      description: |
        Repeat this key for multiple category IDs, for example
        `category_ids=1&category_ids=2`, or send `category_ids=1,2`.
        IDs within this group are ORed.
      style: form
      explode: true
      schema:
        type: array
        items: {type: integer, format: int64, minimum: 1}
      example: [1, 2]
    ProviderIDs:
      name: provider_ids
      in: query
      description: Repeat this key or separate IDs with commas to match any provider IDs.
      style: form
      explode: true
      schema:
        type: array
        items: {type: integer, format: int64, minimum: 1}
      example: [2, 3]
    BrandIDs:
      name: brand_ids
      in: query
      description: Repeat this key or separate IDs with commas to match any brand IDs.
      style: form
      explode: true
      schema:
        type: array
        items: {type: integer, format: int64, minimum: 1}
      example: [7, 8]
    MinPrice:
      name: min_price
      in: query
      description: Inclusive minimum EGP price; a non-negative decimal string.
      schema: {type: string}
      example: '1000.50'
    MaxPrice:
      name: max_price
      in: query
      description: |
        Inclusive maximum EGP price; a non-negative decimal string. Must be
        greater than or equal to `min_price` when both are supplied.
      schema: {type: string}
      example: '5000'
    InStock:
      name: in_stock
      in: query
      description: |
        `true` selects known in-stock products; `false` selects known
        out-of-stock products. Omit to include unknown-stock products too.
      schema: {type: boolean}
      example: true
    Sort:
      name: sort
      in: query
      description: |
        `id` sorts by ascending ID. Price sorts use ascending ID for ties and
        place null prices last. Without a sort, text searches use relevance and
        wildcard listings use ascending ID.
      schema:
        type: string
        enum: [id, price_asc, price_desc]
      example: price_asc

  responses:
    BadRequest:
      description: |
        Invalid query, path, or filter. Binding errors use `Invalid query
        parameters` or `Invalid path parameters` and may include validation
        details. Semantic filter errors use a message beginning with
        `invalid product filter`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidLimit:
              value:
                success: false
                error:
                  code: BAD_REQUEST
                  message: Invalid query parameters
                  details: {Limit: max}
            invalidPriceRange:
              value:
                success: false
                error:
                  code: BAD_REQUEST
                  message: 'invalid product filter: min_price exceeds max_price'
    ProductNotFound:
      description: No product exists with the supplied positive ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: {code: NOT_FOUND, message: Product not found}
    InternalError:
      description: |
        Unexpected service error. The body normally uses the standard error
        envelope; a recovered panic can produce an empty HTTP 500 response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: {code: INTERNAL_ERROR, message: An unexpected error occurred}

  schemas:
    ChatRequest:
      type: object
      required: [message]
      properties:
        session_id:
          type: string
          format: uuid
          description: Omit to create a new ADK session.
        message:
          type: string
          minLength: 1
          maxLength: 4096
    RecommendedProduct:
      type: object
      required: [id, name, price, currency, in_stock, provider, canonical_product_url]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        price: {type: string, description: Decimal EGP price from the catalog.}
        currency: {type: string, example: EGP}
        in_stock: {type: boolean, nullable: true}
        provider: {type: string}
        canonical_product_url: {type: string, format: uri}
        image_url: {type: string, format: uri, nullable: true}
    ChatResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:
          type: object
          required: [session_id, message, products]
          properties:
            session_id: {type: string, format: uuid}
            message: {type: string}
            products:
              type: array
              items: {$ref: '#/components/schemas/RecommendedProduct'}
            estimated_total:
              type: object
              required: [amount, currency]
              properties:
                amount: {type: string, description: Exact decimal sum of selected catalog listings.}
                currency: {type: string, example: EGP}
    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data:
          type: object
          required: [status]
          properties:
            status: {type: string, enum: [ok]}
    Category:
      type: object
      required: [id, slug]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        slug:
          type: string
          enum: [cpu, gpu, motherboard, ram, ssd, hdd, case, power_supply, cooling]
    Provider:
      type: object
      required: [id, name]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        name: {type: string, enum: [sigma, elnekhely, elbadr]}
    Brand:
      type: object
      required: [id, name]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        name: {type: string}
    Product:
      type: object
      required: [id, name, price, currency, in_stock, image_url, category, provider, brand]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Database product ID. Use with `/products/{id}`.
        name: {type: string}
        price:
          type: string
          nullable: true
          description: Decimal EGP price as a string, or null when unknown.
          example: '3499.00'
        currency: {type: string, enum: [EGP]}
        in_stock:
          type: boolean
          nullable: true
          description: True, false, or null when availability is unknown.
        image_url:
          type: string
          format: uri
          nullable: true
          description: Provider image URL, or null when unavailable.
        category: {$ref: '#/components/schemas/Category'}
        provider: {$ref: '#/components/schemas/Provider'}
        brand:
          type: object
          nullable: true
          description: Brand object or null when unknown.
          required: [id, name]
          properties:
            id: {type: integer, format: int64, minimum: 1}
            name: {type: string}
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          required: [canonical_product_url, created_at, updated_at]
          properties:
            canonical_product_url:
              type: string
              format: uri
              description: Canonical URL of the product at its provider.
            created_at:
              type: string
              format: date-time
              description: Time this product row was first created.
            updated_at:
              type: string
              format: date-time
              description: Time the stored product row was last updated.
    PageMeta:
      type: object
      required: [page, limit, total_items, total_pages]
      properties:
        page: {type: integer, minimum: 1}
        limit: {type: integer, minimum: 1, maximum: 100}
        total_items: {type: integer, minimum: 0}
        total_pages: {type: integer, minimum: 0}
    ProductPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Product'}
        meta: {$ref: '#/components/schemas/PageMeta'}
    ProductListResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data: {$ref: '#/components/schemas/ProductPage'}
    ProductSearchResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: {type: boolean, enum: [true]}
        data:
          type: array
          items: {$ref: '#/components/schemas/Product'}
        meta: {$ref: '#/components/schemas/PageMeta'}
    ProductDetailResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data: {$ref: '#/components/schemas/ProductDetail'}
    CategoriesResponse:
      type: object
      required: [success]
      properties:
        success: {type: boolean, enum: [true]}
        data:
          type: array
          items: {$ref: '#/components/schemas/Category'}
    ProvidersResponse:
      type: object
      required: [success]
      properties:
        success: {type: boolean, enum: [true]}
        data:
          type: array
          items: {$ref: '#/components/schemas/Provider'}
    BrandsResponse:
      type: object
      required: [success]
      properties:
        success: {type: boolean, enum: [true]}
        data:
          type: array
          items: {$ref: '#/components/schemas/Brand'}
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: {type: boolean, enum: [false]}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, enum: [BAD_REQUEST, NOT_FOUND, INTERNAL_ERROR]}
            message: {type: string}
            details:
              description: Optional binding details; a string or field-to-rule map.
              oneOf:
                - {type: string}
                - type: object
                  additionalProperties: {type: string}

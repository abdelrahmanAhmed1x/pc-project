version: "2"

sql:
  - name: "products"
    engine: "postgresql"

    schema: "../../../migrations"

    queries:
      - "queries/queries.sql"

    strict_function_checks: true
    strict_order_by: true

    gen:
      go:
        package: "sqlc"
        out: "sqlc"
        sql_package: "pgx/v5"

        emit_interface: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true

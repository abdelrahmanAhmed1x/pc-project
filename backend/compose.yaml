services:
  typesense:
    image: typesense/typesense:29.0
    container_name: typesense
    restart: unless-stopped

    ports:
      - "8108:8108"

    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "true"

    volumes:
      - typesense-data:/data

volumes:
  typesense-data: